<div class="produto">

<h3>{{ nome | uppercase}}</h3>
<p>{{ preco | precoFormatado}}</p>
<button mat-stroked-button color="accent" (click)="selecionarProduto()">
    Selecionar {{ nome }}
</button>
<button mat-raised-button color="primary" (click)="adicionarAoCarrinho()">
    Adicionar ao carrinho
</button>
 

</div>
